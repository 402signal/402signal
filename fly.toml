# fly.toml - single app 402signal. No extra hostnames.
# Launch later with: fly launch --ha=false
# Do not set auto_stop; keep one machine running.
# Do not fly deploy, fly scale, or set secrets from this PR.

app = "402signal"
primary_region = "iad"

[build]
  # Optional. Fingerprints /styles.css and /app.js as ?v=<gitsha>.
  # If omitted, the image records SHA from copied .git/HEAD at build.
  #   fly deploy --build-arg GIT_SHA=$(git rev-parse HEAD)
  # Do not expose FLY_IMAGE_REF or add a public SHA/status endpoint.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Production check stays /health (liveness). Do not silently switch this
# path. A later authorized deploy may add a second check on /ready
# (integrity). Proposed snippet is in docs/fly-ready-check.md:
#   [[http_service.checks]]
#     grace_period = "10s"
#     interval = "15s"
#     method = "GET"
#     path = "/ready"
#     timeout = "5s"
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"  # Ross GO 2026-08-30; ~$5.92/mo. Do not ship 256mb.
  cpus = 1

# 1GB persistent volume for probe history + catalog.sqlite + pq-log*.sqlite (Ross approved ~$0.15/mo).
# Process-local only. Do not HTTP-serve /data or sqlite files.
# PRODUCTION is MainNet-only. Unset/unknown network must fail closed.
# Live log: /data/pq-log-mainnet.sqlite (epoch mainnet-v1).
# pq-log.sqlite is the archived TestNet shard (TEST SUPPORT only). Do not delete it.
# Do not set TestNet Falcon address, TestNet log SK, TestNet signer HMAC,
# or TestNet broadcast flags here.
# Do not enable TestNet or MainNet Falcon broadcast from this file.
# Automatic anchoring stays off. No extra machines in this PR. Falcon SK is not on this app.
# Scheduled snapshots off.
[[mounts]]
  source = "data"
  destination = "/data"

[env]
  LIVE402_HISTORY_DB = "/data/live402-history.sqlite"
  LIVE402_CATALOG_DB = "/data/catalog.sqlite"
  LIVE402_REPLAY_DB = "/data/live402-replay.sqlite"
  LIVE402_PQ_LOG_DB = "/data/pq-log-mainnet.sqlite"
  LIVE402_PQ_LOG_EPOCH = "mainnet-v1"
  LIVE402_PQ_LOG_ORIGIN = "402signal.com/pq/log/mainnet-v1"
  # Public MainNet Falcon f1 address (safe to store). Secrets must match MainNet Falcon.
  # TestNet OBHYX... must not appear as a MainNet default.
  LIVE402_PQ_FALCON_MAINNET_ADDRESS = "GVIAG3YMJ7OLJ3JAUBNI2YP5JCQQCQYWN25UAGLC2BTPOBUL3ZZTILIMWU"
  LIVE402_PQ_FALCON_NETWORK = "mainnet"
